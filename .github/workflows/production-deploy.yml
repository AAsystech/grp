name: Production Deployment

on:
  workflow_dispatch:

jobs:
  production-deploy:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: database/requirements.txt

      - name: Install database dependencies
        run: pip install -r database/requirements.txt

      - name: Run production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic -c database/alembic.ini upgrade head

      - name: Production deployment pending GCP setup
        if: ${{ vars.GCP_DEPLOYMENT_ENABLED != 'true' }}
        run: |
          echo "GCP deployment is not enabled yet."
          echo "Production database migration completed successfully."
          echo "Backend deployment will be enabled after Google Cloud setup."

      # Google Cloud production deployment will be added here
      # after the GCP project, service account, and deployment
      # configuration are ready.