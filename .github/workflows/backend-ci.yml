name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "database/**"
      - "infrastructure/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "database/**"
      - "infrastructure/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            apps/backend/requirements.txt
            database/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Install database dependencies
        run: pip install -r database/requirements.txt

      - name: Verify backend imports
        working-directory: apps/backend
        run: python -c "from app.main import app; print('Backend import successful')"

      - name: Validate Alembic configuration
        run: alembic -c database/alembic.ini heads

      - name: Validate Alembic migration history
        run: alembic -c database/alembic.ini history

      - name: Build backend Docker image
        run: docker build -f apps/backend/Dockerfile -t grp-backend .