
name: Staging Deployment

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "database/**"
      - "infrastructure/**"
      - ".github/workflows/staging-deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: grp-staging-deploy
  cancel-in-progress: false

jobs:
  staging-deploy:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    environment: staging

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: grp-backend
      SERVICE: grp-backend-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install database dependencies
        run: pip install -r database/requirements.txt

      - name: Run staging database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Staging DATABASE_URL is missing"
            exit 1
          fi
          alembic -c database/alembic.ini upgrade head

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/grp-backend:${GITHUB_SHA}"
          docker build -f apps/backend/Dockerfile -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --service-account "grp-backend-runtime@grp-511923.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --quiet

      - name: Display deployment URL
        run: |
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format="value(status.url)"
